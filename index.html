<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FYM" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FollowYourMoney</title>
    <script>
      // Applique le thème avant le premier rendu (évite un flash clair en mode sombre).
      // Clé et format alignés sur useThemeStore (zustand persist) : shared/theme/theme.store.ts
      try {
        var theme = (JSON.parse(localStorage.getItem('fym-theme')) || {}).state?.theme || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Visible avant le JavaScript ; remplacé par React au premier rendu (même rendu que Splash) -->
      <div style="min-height:100dvh;display:grid;place-items:center">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-label="FollowYourMoney" style="animation:fym-pulse 1.4s ease-in-out infinite">
          <defs><linearGradient id="fym-boot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5868f0"/><stop offset="1" stop-color="#343cbe"/></linearGradient></defs>
          <rect width="64" height="64" rx="16" fill="url(#fym-boot)"/>
          <path d="M13 45 26 32l9 6.5L50 21M40 21h10v10" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <style>
      html { background: #fbfbfd; } html.dark { background: #0e0f14; }
      @keyframes fym-pulse { 50% { opacity: .55; transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { svg { animation: none !important; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
