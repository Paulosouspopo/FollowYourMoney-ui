name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b (types, tests inclus) puis bundle Vite
      - run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: Image Docker de production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t fym-web .
      - name: Caddyfile valide
        run: docker run --rm -e DOMAIN=example.com fym-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
